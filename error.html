    <title>Printer Setup Assistance</title>
    <meta name="description"
          content="Printer setup assistance and troubleshooting information.">

    <link rel="stylesheet" href="error.css">

<body>

    <div class="error-page">

        <!-- TOP HEADER -->
        <div class="error-header">

            <div>
                <h1>Printer Setup</h1>

                <p>
                    Setup could not be completed
                </p>
            </div>

        </div>


        <!-- MAIN CONTENT -->
        <main class="error-content">

            <!-- ERROR ICON -->
            <div class="printer-error-icon">

                <div class="printer-body">
                    <div class="paper"></div>
                    <span>!</span>
                </div>

                <div class="error-circle"></div>

            </div>


            <h2>
                Setup Could Not Be Completed
            </h2>

            <p class="main-message">
                We couldn't complete the printer setup at this time.
                Please check your printer connection and try again.
            </p>


            <p class="support-message">
                If you need further assistance, please contact
                customer support.
            </p>


            <div class="support-number">
                Toll Free (USA/CA):
                <a href="tel:+18447151235">
                    +1 (844) 715-1235
                </a>
            </div>


            <div class="error-actions">

                <button
                    type="button"
                    onclick="window.location.href='index.html'">
                    Try Again
                </button>

            </div>

        </main>


        <!-- BOTTOM BLUE AREA -->
        <footer class="error-footer">

            <div class="footer-brand">
                EPSON
            </div>

        </footer>

    </div>
